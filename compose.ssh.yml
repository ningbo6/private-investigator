name: company-detective-ssh
services:
  company-detective:
    build: .
    image: company-detective:ssh
    restart: unless-stopped
    init: true
    stop_grace_period: 370s
    env_file: .env.runtime
    environment:
      COMPANY_DETECTIVE_HOST: 0.0.0.0
      COMPANY_DETECTIVE_PUBLIC_ORIGIN: ''
      COMPANY_DETECTIVE_DB_PATH: /data/company_detective.sqlite3
    ports:
      - '127.0.0.1:8765:8765'
    volumes:
      - reports:/data
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  reports:
